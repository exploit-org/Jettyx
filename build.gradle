plugins {
    id 'java-library'
    id 'jacoco'
    id 'tech.yanand.maven-central-publish' version '1.2.0'
}

group = 'org.exploit'
version = findProperty('releaseVersion') ?: '0.2.0'

ext {
    jacksonVersion = '2.22.4'
    junitVersion = '5.11.4'
}

allprojects {
    apply plugin: 'java-library'
    apply plugin: 'jacoco'

    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }

        withSourcesJar()
        withJavadocJar()
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:${rootProject.ext.junitVersion}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    sourceSets.test {
        java.srcDir rootProject.file('src/testFixtures/java')
        resources.srcDir rootProject.file('src/testFixtures/resources')
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addBooleanOption('Xdoclint:none', true)
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
        finalizedBy tasks.named('jacocoTestReport')
    }

    jacocoTestReport {
        reports {
            xml.required = true
            html.required = true
        }
    }

    jacocoTestCoverageVerification {
        dependsOn tasks.named('test')

        violationRules {
            rule {
                limit {
                    counter = 'LINE'
                    minimum = 0.95
                }
                limit {
                    counter = 'BRANCH'
                    minimum = 0.90
                }
            }
        }
    }

    tasks.named('check') {
        dependsOn tasks.named('jacocoTestCoverageVerification')
    }
}

apply from: 'gradle/publishing.gradle'
apply from: 'gradle/verification.gradle'
