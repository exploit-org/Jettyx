plugins {
    id 'java'
    id 'jacoco'
    id 'java-library'
    id 'signing'
    id 'tech.yanand.maven-central-publish' version '1.2.0'
}

repositories {
    mavenCentral()
}


ext {
    jacksonVersion = '2.22.4'
    junitVersion = '5.11.4'
    projectName = "Jettyx"
    projectDescription = "A declarative HTTP client for Java"
}

allprojects {
    repositories {
        mavenCentral()
    }

    apply plugin: 'java-library'
    apply plugin: 'jacoco'
    dependencies {
        testImplementation platform("org.junit:junit-bom:${rootProject.ext.junitVersion}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    sourceSets.test {
        java.srcDir rootProject.file('src/testFixtures/java')
        resources.srcDir rootProject.file('src/testFixtures/resources')
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addBooleanOption('Xdoclint:none', true)
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
        finalizedBy tasks.named('jacocoTestReport')
    }

    jacocoTestReport {
        reports {
            xml.required = true
            html.required = true
        }
    }

    apply plugin: 'signing'
    apply plugin: 'maven-publish'
    apply plugin: 'tech.yanand.maven-central-publish'

    java {
        withSourcesJar()
        withJavadocJar()

        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    group = 'org.exploit'
    version = '0.1.6'

    afterEvaluate { p ->
        publishing {
            publications {
                mavenJava(MavenPublication) {
                    from components.java

                    pom {
                        name = p.findProperty('projectName') ?: 'Jettyx Jackson Support'
                        description = p.findProperty('projectDescription') ?: 'Adds Jackson support to Jettyx'
                        url = 'https://github.com/exploit-org/Jettyx'

                        licenses {
                            license {
                                name = 'BSD-2-Clause'
                                url = 'https://github.com/exploit-org/Jettyx/blob/main/LICENSE.md'
                            }
                        }

                        developers {
                            developer {
                                id = '0'
                                name = 'Martin Belov'
                                email = 'martin@exploit.org'
                            }
                        }

                        scm {
                            connection = 'scm:git:https://github.com/exploit-org/Jettyx.git'
                            developerConnection = 'scm:git:ssh://github.com/exploit-org/Jettyx.git'
                            url = 'https://github.com/exploit-org/Jettyx'
                        }
                    }
                }
            }

            repositories {
                maven {
                    name = "Local"
                    url = file("${buildDir}/repos/bundles")
                }
            }
        }

        signing {
            sign publishing.publications.mavenJava
        }

        mavenCentral {
            repoDir = layout.buildDirectory.dir('repos/bundles')

            authToken = System.getenv("CENTRAL_MAVEN_TOKEN")
        }
    }
}

test {
    useJUnitPlatform()
}
